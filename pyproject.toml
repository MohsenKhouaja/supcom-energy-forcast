[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "supcom-smart-grid-ai"
version = "0.1.0"
description = "SUP'COM energy forecasting, benchmarking, and billing research project"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - academic project" }
authors = [
  { name = "SUP'COM Project 2 team" },
]
dependencies = []

[project.optional-dependencies]
data = ["numpy>=1.24", "openpyxl>=3.1", "pandas>=2.0", "pyarrow>=12"]
eda = ["jupyterlab>=4", "matplotlib>=3.7", "plotly>=5.18", "seaborn>=0.13"]
ml = ["scikit-learn>=1.3", "statsmodels>=0.14", "xgboost>=2.0"]
dl = ["torch>=2.1"]
dashboard = ["streamlit>=1.30"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
